name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # প্রতিদিন মধ্যরাতে রান হবে
  workflow_dispatch:       # ম্যানুয়ালি রান করার জন্য

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4  # v3 থেকে v4 তে আপগ্রেড
      
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: CodeByMonir
          outputs: |
            # ফায়ারি অরেঞ্জ (Fierce Orange) থিম
            output/github-contribution-grid-snake.svg?color_snake=%23FF6B00&color_dots=%23FF6B00,%23FF9F00,%23FFD700,%23FF4500
            output/github-contribution-grid-snake-dark.svg?palette=github-dark
      
      - uses: stefanzweifel/git-auto-commit-action@v5  # v4 থেকে v5 তে আপগ্রেড
        with:
          commit_message: "🔥 Update snake with Fierce Orange theme"
          file_pattern: 'output/*.svg'