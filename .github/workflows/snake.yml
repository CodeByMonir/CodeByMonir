name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # প্রতিদিন মধ্যরাতে রান হবে
  workflow_dispatch:       # ম্যানুয়ালি রান করার জন্য

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4  # v3 থেকে v4 তে আপগ্রেড করা হয়েছে
      
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: CodeByMonir
          outputs: |
            # টেকসই নীল (Tech Blue) থিম - আপনার জন্য সেরা পছন্দ
            output/github-contribution-grid-snake.svg?color_snake=#FF6B00&color_dots=#FF6B00,#FF9F00,#FFD700
            output/github-contribution-grid-snake-dark.svg?palette=github-dark
      
      - uses: stefanzweifel/git-auto-commit-action@v5  # v4 থেকে v5 তে আপগ্রেড করা হয়েছে
        with:
          commit_message: "🔄 Update snake animation with Tech Blue theme"
          file_pattern: 'output/*.svg'